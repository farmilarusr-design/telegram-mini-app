<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Мой Mini App</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>

    <div class="container">

        <h1>Мой Mini App</h1>

        <div class="card" onclick="openProfile()">
            <div class="icon">👤</div>

            <div>
                <h2>Профиль</h2>
                <p>Посмотреть свой профиль</p>
            </div>
        </div>

        <div class="card" onclick="openSettings()">
            <div class="icon">⚙️</div>

            <div>
                <h2>Настройки</h2>
                <p>Настроить приложение</p>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
